[project]
name = "ringaround"
version = "0.1.0"
description = "Outbound quote-gathering voice agent with intel layer"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]
telnyx = ["fastapi>=0.100", "uvicorn[standard]>=0.27", "websockets>=12.0"]
deepgram = ["deepgram-sdk>=3.0"]
cartesia = ["cartesia>=1.0"]

[project.scripts]
ringaround = "ringaround.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
